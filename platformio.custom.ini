; ==============================
; SPECIAL MEMORY LAYOUT!
;

[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_OFFSET=0x1C0000
  ; -D KNX_FLASH_OFFSET=0xD0000 - force fail
  -D KNX_FLASH_SIZE=0x30000
  ; regular
  -D OPENKNX_FLASH_OFFSET=0x1F0000
  -D OPENKNX_FLASH_SIZE=0x4000
  ; -D EXCHANGE_FLASH_OFFSET=0x200000
  ; -D EXCHANGE_FLASH_SIZE=0x10000

; 16MB Flash
[RP2040_16MB]
board_upload.maximum_size = 16777216 ; 16MiB (Total size of the flash)
#board_build.filesystem_size = 15724544 ; 15MiB (16MiB - 1MiB - 4096 bytes)
board_build.filesystem_size = 14675968 ; 14MiB (16MiB - 2MiB - 4096 bytes)

;
; SPECIAL MEMORY LAYOUT!
; ==============================



;
; global custom
;
[custom]
build_flags =
  ${KNX_TP.build_flags}
  -D SERIAL_DEBUG=Serial
  -fexceptions
  -D KNX_IP_LAN
  -D OPENKNX_USB_EXCHANGE_IGNORE

[develop]
extends = RP2040_develop, custom
build_flags =
  ${RP2040_develop.build_flags}
  ${custom.build_flags}
  ;-D OPENKNX_HEARTBEAT
   -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE3=DummyChannel<1>"
  ; "-D OPENKNX_TRACE4=DummyChannel<[3-5]>"
  ;-D OPENKNX_RUNTIME_STAT
  -D OPENKNX_RUNTIME_STAT_BUCKETN=10
  "-D OPENKNX_RUNTIME_STAT_BUCKETS=5000, 6000, 7000, 8000, 10000, 15000, 30000, 50000, 100000"


; this config block is for specifing options that are valid for all release builds
[releases]
extends = RP2040_releases, custom
build_flags =
  ${RP2040_releases.build_flags}
  ${custom.build_flags}


; ------ REG1-Eth V1------
[env:develop_REG1_ETH_V1]
extends = develop, RP2040_16MB
build_flags =
   ${develop.build_flags}
  -D DEVICE_REG1_ETH
 # -D KNX_IP_GENERIC
 # TODO replace
 -D KNX_IP_W5500

[env:develop_REG1_ETH_V1_USB]
extends = RP2040_UPLOAD_USB, env:develop_REG1_ETH_V1

[env:develop_REG1_ETH_V1_JLINK]
extends = UPLOAD_JLINK, env:develop_REG1_ETH_V1


[env:release_REG1_ETH_V1]
extends = releases, RP2040_16MB
build_flags =
  ${releases.build_flags}
  # ${RP2040_WITH_SYSTEM_2MB_EXCHANGE_16MB.build_flags}
  -D DEVICE_REG1_ETH


; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D OPENKNX_LED_TIME=info3Led
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[env:develop_DEVICE_REG1_LAN_TP_Base]
extends = ESP32_develop, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_develop.build_flags}
  ${ESP32_custom.build_flags}
  ; ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  ; -D CONFIG_ETH_ENABLED #only for ESP32

[env:release_REG1_LAN_TP_Base]
extends = ESP32_releases, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ; ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  ; -D CONFIG_ETH_ENABLED #only for ESP32


